# All informations about the simulator configuration are described in the
# README.md

# Number of simulations to run
nbSimu = 1000

# Policy to use for the ghost hunter (RANDOM, NEXT_VERTEX)
policy = "NEXT_VERTEX"

# Execution type (SINGLE, UP_TO_SIZE, FAMILY)
execType = "UP_TO_SIZE"

# Graph configuration
[graphConfig]
# Graph type (N_CYCLE, N_COMP, N_K_REGULAR, FROM_FILE)
graphType = "FROM_FILE"
filename = "graphs/3_clique.txt"
N = 6
K = 3
