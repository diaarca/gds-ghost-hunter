# All informations about the simulator configuration are described in the
# README.md

# Number of simulations to run
nbSimu = 100000

# Policy to use for the ghost hunter (RANDOM, HIGH_DEGREE_PRIO, NEXT_VERTEX)
policy = "NEXT_VERTEX"

# Execution type (SINGLE, UP_TO_SIZE, FAMILY)
execType = "SINGLE"

# Graph configuration
[graphConfig]
# Graph type (N_CONN, N_CYCLE, N_COMP, N_K_REGULAR, FROM_FILE)
graphType = "N_COMP"
filename = "graphs/3_clique.txt"
N = 4
K = 2
